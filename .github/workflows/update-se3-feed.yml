name: Update SE3 price feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-se3-feed
  cancel-in-progress: true

env:
  RETENTION_DAYS: 30

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check whether prices are missing
        id: prices
        shell: bash
        run: |
          TODAY=$(TZ=Europe/Helsinki date +%Y%m%d)
          TOMORROW=$(TZ=Europe/Helsinki date -d tomorrow +%Y%m%d)
          HOUR=$(TZ=Europe/Helsinki date +%H)
          git fetch origin prices:refs/remotes/origin/prices || true

          TARGETS=()
          if ! git cat-file -e "origin/prices:se3/${TODAY}.json" 2>/dev/null; then
            echo "Today's file ${TODAY} is missing"
            TARGETS+=("$TODAY")
          fi
          if (( 10#$HOUR >= 20 )) && ! git cat-file -e "origin/prices:se3/${TOMORROW}.json" 2>/dev/null; then
            echo "Tomorrow's file ${TOMORROW} is missing after 20:00 local time"
            TARGETS+=("$TOMORROW")
          fi

          echo "targets=${TARGETS[*]}" >> "$GITHUB_OUTPUT"
          if (( ${#TARGETS[@]} == 0 )); then
            echo "Required compact prices already exist; Nord Pool will not be queried"
          fi
      - name: Build compact feed
        if: steps.prices.outputs.targets != ''
        run: node scripts/update-se3-feed.mjs /tmp/se3-feed ${{ steps.prices.outputs.targets }}
      - name: Publish prices branch
        if: steps.prices.outputs.targets != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin prices:prices

          rm -rf /tmp/prices-snapshot
          mkdir -p /tmp/prices-snapshot
          git archive prices se3 | tar -x -C /tmp/prices-snapshot
          BEFORE=$(find /tmp/prices-snapshot/se3 -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)

          mkdir -p /tmp/prices-snapshot/se3
          if compgen -G "/tmp/se3-feed/*.json" > /dev/null; then
            cp /tmp/se3-feed/*.json /tmp/prices-snapshot/se3/
          fi

          CUTOFF=$(TZ=Europe/Helsinki date -d "$((RETENTION_DAYS - 1)) days ago" +%Y%m%d)
          for FILE in /tmp/prices-snapshot/se3/*.json; do
            DAY=${FILE##*/}
            DAY=${DAY%.json}
            if [[ "$DAY" =~ ^[0-9]{8}$ ]] && [[ "$DAY" < "$CUTOFF" ]]; then
              echo "Removing expired price file ${DAY}.json"
              rm -- "$FILE"
            fi
          done

          AFTER=$(find /tmp/prices-snapshot/se3 -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          if [[ "$BEFORE" == "$AFTER" ]]; then
            echo "Feed is unchanged"
            exit 0
          fi

          git switch --orphan prices-snapshot
          git rm -rf . || true
          cp -R /tmp/prices-snapshot/se3 .
          git add se3
          git commit -m "Current compact SE3 prices"
          git push --force origin prices-snapshot:prices
